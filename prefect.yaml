name: lthhc-ai-automation-platform
prefect-version: 3.8.4
build: null
push: null
pull: null
deployments:
  - name: prefect-control-room-test
    description: PHI-safe local server, worker, flow, and task wiring check.
    tags:
      - synthetic
      - phi-safe
    schedule: null
    entrypoint: src/orchestration/prefect_control_room.py:phi_safe_control_room_flow
    parameters: {}
    work_pool:
      name: lthhc-local-process
      work_queue_name: null
      job_variables: {}
  - name: document-processor-manual
    description: Manual-only sealed-handoff one-message/one-document acceptance with PHI-safe operational output.
    tags:
      - manual
      - phi-safe
    schedule: null
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    entrypoint: src/orchestration/prefect_mailbox_workflow.py:bounded_mailbox_flow
    parameters: {}
    work_pool:
      name: lthhc-local-process
      work_queue_name: null
      job_variables: {}
  - name: document-processor-live
    description: Operator-owned polled one-candidate unattended production mailbox processing.
    tags:
      - unattended
      - phi-safe
    schedule: null
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    entrypoint: src/orchestration/prefect_mailbox_workflow.py:unattended_mailbox_flow
    parameters: {}
    work_pool:
      name: lthhc-local-process
      work_queue_name: null
      job_variables: {}
